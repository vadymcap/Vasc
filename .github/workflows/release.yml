name: Release

permissions:
  contents: write

on:
  push:
    tags: ["*"]

jobs:
  ensure-release:
    name: Create or Update Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Ensure Release Exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft=false
            if [[ "$TAG" != *pre* ]]; then
              gh release edit "$TAG" --latest
            fi
          else
            if [[ "$TAG" == *pre* ]]; then
              gh release create "$TAG" --prerelease --generate-notes
            else
              gh release create "$TAG" --latest --generate-notes
            fi
          fi

  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: ensure-release

    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64
          - host: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64

          - host: macos
            os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64

          - host: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64

            # aarch64
          - host: macos
            os: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Resolve Asset Version
        id: vars
        shell: bash
        run: |
          echo "asset_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: hecrj/setup-rust-action@v2
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --all-features --release --verbose --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive (Unix)
        if: ${{ matrix.host != 'windows' }}
        shell: bash
        run: |
          mkdir release
          cp "target/${{ matrix.target }}/release/vasc" release/
          cd release
          zip ../vasc-${{ steps.vars.outputs.asset_version }}-${{ matrix.label }}.zip *

      - name: Archive (Windows)
        if: ${{ matrix.host == 'windows' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/vasc.exe" "release/vasc.exe"
          Compress-Archive -Path "release/vasc.exe" -DestinationPath "vasc-${{ steps.vars.outputs.asset_version }}-${{ matrix.label }}.zip" -Force
          Copy-Item "vasc-${{ steps.vars.outputs.asset_version }}-${{ matrix.label }}.zip" "vasc-${{ steps.vars.outputs.asset_version }}-win32-x64.zip" -Force

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vasc-${{ steps.vars.outputs.asset_version }}-${{ matrix.label }}.zip
          path: vasc-${{ steps.vars.outputs.asset_version }}-${{ matrix.label }}.zip

      - name: Upload to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "vasc-${{ steps.vars.outputs.asset_version }}-${{ matrix.label }}.zip" --clobber

      - name: Upload Windows Compatibility Asset
        if: ${{ matrix.host == 'windows' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "vasc-${{ steps.vars.outputs.asset_version }}-win32-x64.zip" --clobber
